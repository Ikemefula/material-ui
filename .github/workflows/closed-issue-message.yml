name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@4512ed40c3abe07e677ea66a74fd9ef89fc1e732 # master
    permissions:
      contents: read
      issues: write
